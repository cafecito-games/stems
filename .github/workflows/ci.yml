name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Verify generated code is up to date
        run: |
          task generate
          git diff --exit-code

      - name: Check copyright headers
        run: task header:check

      - name: Verify module zip excludes LFS files
        run: task mod:check

      - name: Vet
        run: task vet

      - name: Test with race detector
        run: task test:cover

      - name: Verify binaries build
        run: task build

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11

      - name: Verify formatting
        run: golangci-lint fmt --diff ./...
